<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atari Pong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
  }
  canvas {
    border: 2px solid #fff;
    display: block;
  }
  #info {
    margin-top: 10px;
    font-size: 13px;
    color: #aaa;
  }
</style>
</head>
<body>
<canvas id="pong" width="800" height="600"></canvas>
<div id="info">W/S = Left Paddle &nbsp;|&nbsp; ↑/↓ = Right Paddle &nbsp;|&nbsp; SPACE = Serve</div>

<script type="module">
  import { init } from './js/game.js';
  
  // Initialize game when DOM is ready
  const canvas = document.getElementById('pong');
  init(canvas);
</script>
</body>
</html>
