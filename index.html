<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atari Pong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
  }
  canvas {
    border: 2px solid #fff;
    display: block;
  }
  #info {
    margin-top: 10px;
    font-size: 13px;
    color: #aaa;
  }
</style>
</head>
<body>
<canvas id="pong" width="800" height="600"></canvas>
<div id="info">W/S = Left Paddle &nbsp;|&nbsp; ↑/↓ = Right Paddle &nbsp;|&nbsp; SPACE = Serve</div>

<script>
const canvas = document.getElementById('pong');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;

// --- Constants ---
const PADDLE_W = 12;
const PADDLE_H = 80;
const BALL_SIZE = 12;
const PADDLE_SPEED = 5;
const BALL_SPEED_INIT = 5;
const BALL_SPEED_MAX = 12;
const BALL_SPEED_INC = 0.4;
const WALL_MARGIN = 0;       // top/bottom wall y offset
const MAX_ANGLE_DEG = 70;
const SERVE_ANGLE_MAX = 15;  // degrees of random vertical on serve

// --- State ---
let scores = [0, 0];
let gameState = 'waiting'; // 'waiting' | 'playing'
let serveSide = 0; // 0 = left, 1 = right

const paddles = [
  { x: 30, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, dy: 0 },
  { x: W - 30 - PADDLE_W, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, dy: 0 }
];

let ball = {
  x: W / 2 - BALL_SIZE / 2,
  y: H / 2 - BALL_SIZE / 2,
  w: BALL_SIZE,
  h: BALL_SIZE,
  vx: 0,
  vy: 0,
  speed: BALL_SPEED_INIT
};

// --- Input ---
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (gameState === 'waiting') serveBall();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// --- Serve ---
function serveBall() {
  gameState = 'playing';
  ball.speed = BALL_SPEED_INIT;

  // Random vertical angle on serve (±SERVE_ANGLE_MAX degrees)
  const vertAngle = (Math.random() * 2 - 1) * SERVE_ANGLE_MAX;
  const vertRad = vertAngle * Math.PI / 180;

  // Direction: toward the side that just conceded (or random first serve)
  const dir = serveSide === 0 ? 1 : -1;

  ball.vx = dir * Math.cos(vertRad) * ball.speed;
  ball.vy = Math.sin(vertRad) * ball.speed;

  // Place ball at center
  ball.x = W / 2 - BALL_SIZE / 2;
  ball.y = H / 2 - BALL_SIZE / 2;
}

// --- Paddle movement ---
function movePaddles() {
  // Left paddle: W / S
  if (keys['KeyW']) paddles[0].dy = -PADDLE_SPEED;
  else if (keys['KeyS']) paddles[0].dy = PADDLE_SPEED;
  else paddles[0].dy = 0;

  // Right paddle: ArrowUp / ArrowDown
  if (keys['ArrowUp']) paddles[1].dy = -PADDLE_SPEED;
  else if (keys['ArrowDown']) paddles[1].dy = PADDLE_SPEED;
  else paddles[1].dy = 0;

  for (let p of paddles) {
    p.y += p.dy;
    // Clamp paddle within walls
    p.y = Math.max(WALL_MARGIN, Math.min(H - WALL_MARGIN - p.h, p.y));
  }
}

// --- Ball physics ---
function moveBall() {
  if (gameState !== 'playing') return;

  ball.x += ball.vx;
  ball.y += ball.vy;

  // ---- Top wall collision ----
  if (ball.y <= WALL_MARGIN) {
    ball.y = WALL_MARGIN + 1; // nudge 1px away from wall
    ball.vy = Math.abs(ball.vy);
  }

  // ---- Bottom wall collision ----
  if (ball.y + ball.h >= H - WALL_MARGIN) {
    ball.y = H - WALL_MARGIN - ball.h - 1; // nudge 1px away from wall
    ball.vy = -Math.abs(ball.vy);
  }

  // ---- Paddle collisions ----

  // Left paddle (index 0)
  const lp = paddles[0];
  // Leading edge check: ball's left edge crosses paddle's right edge
  if (
    ball.vx < 0 &&
    ball.x <= lp.x + lp.w &&
    ball.x + ball.w > lp.x &&
    ball.y + ball.h > lp.y &&
    ball.y < lp.y + lp.h
  ) {
    ball.x = lp.x + lp.w + 1; // nudge ball out to prevent clipping
    reflectOffPaddle(lp, 1);
  }

  // Right paddle (index 1)
  const rp = paddles[1];
  // Leading edge check: ball's right edge crosses paddle's left edge
  if (
    ball.vx > 0 &&
    ball.x + ball.w >= rp.x &&
    ball.x < rp.x + rp.w &&
    ball.y + ball.h > rp.y &&
    ball.y < rp.y + rp.h
  ) {
    ball.x = rp.x - ball.w - 1; // nudge ball out to prevent clipping
    reflectOffPaddle(rp, -1);
  }

  // ---- Scoring ----
  if (ball.x + ball.w < 0) {
    // Right scores
    scores[1]++;
    serveSide = 0; // serve toward left (who just lost)
    resetBall();
  } else if (ball.x > W) {
    // Left scores
    scores[0]++;
    serveSide = 1; // serve toward right (who just lost)
    resetBall();
  }
}

function reflectOffPaddle(paddle, dirX) {
  // Hit position: -1 (top) to +1 (bottom) relative to paddle center
  const paddleCenterY = paddle.y + paddle.h / 2;
  const ballCenterY = ball.y + ball.h / 2;
  const relHit = (ballCenterY - paddleCenterY) / (paddle.h / 2);
  const clampedHit = Math.max(-1, Math.min(1, relHit));

  // Map hit position to angle (±MAX_ANGLE_DEG)
  const angleDeg = clampedHit * MAX_ANGLE_DEG;
  const angleRad = angleDeg * Math.PI / 180;

  // Increase speed on each hit (up to max)
  ball.speed = Math.min(ball.speed + BALL_SPEED_INC, BALL_SPEED_MAX);

  ball.vx = dirX * Math.cos(angleRad) * ball.speed;
  ball.vy = Math.sin(angleRad) * ball.speed;
}

function resetBall() {
  gameState = 'waiting';
  ball.x = W / 2 - BALL_SIZE / 2;
  ball.y = H / 2 - BALL_SIZE / 2;
  ball.vx = 0;
  ball.vy = 0;
  ball.speed = BALL_SPEED_INIT;
}

// --- Drawing ---
function drawRect(x, y, w, h, color = '#fff') {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawDashedCenterLine() {
  ctx.setLineDash([10, 10]);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawScores() {
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 48px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(scores[0], W / 2 - 80, 60);
  ctx.fillText(scores[1], W / 2 + 80, 60);
}

function drawWaitingMessage() {
  if (gameState === 'waiting') {
    ctx.fillStyle = '#aaa';
    ctx.font = '18px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('Press SPACE to serve', W / 2, H - 30);
  }
}

function draw() {
  // Clear
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  drawDashedCenterLine();
  drawScores();

  // Paddles
  for (let p of paddles) drawRect(p.x, p.y, p.w, p.h);

  // Ball
  drawRect(ball.x, ball.y, ball.w, ball.h);

  drawWaitingMessage();
}

// --- Game Loop ---
function loop() {
  movePaddles();
  moveBall();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
